services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
    container_name: es-1c-helper
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5

  mcp-server:
    build: .
    container_name: mcp-1c-helper
    ports:
      - "8000:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./data/hbk:/app/data/hbk:ro
      - ./data/logs:/app/logs
    environment:
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST:-elasticsearch}
      - ELASTICSEARCH_PORT=${ELASTICSEARCH_PORT:-9200}
      - ELASTICSEARCH_INDEX=${ELASTICSEARCH_INDEX:-help1c_docs}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MAX_CONCURRENT_REQUESTS=${MAX_CONCURRENT_REQUESTS:-8}
      - INDEX_BATCH_SIZE=${INDEX_BATCH_SIZE:-100}
      - REINDEX_ON_STARTUP=${REINDEX_ON_STARTUP:-false}
      - SEARCH_MAX_RESULTS=${SEARCH_MAX_RESULTS:-50}
      - SEARCH_TIMEOUT_SECONDS=${SEARCH_TIMEOUT_SECONDS:-30}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  elasticsearch_data:
